version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    # No versioning-strategy, so an update raises the lower bound in
    # pyproject.toml to the version it locks, not only uv.lock. That is the
    # policy, not an accident: every image installs from constraints exported
    # from uv.lock (`uv export --frozen` in each Dockerfile), so the floor
    # never decides what ships, and keeping it at the lock stops an install
    # that ignores the lock from resolving below what CI tested.
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      python-dev:
        patterns:
          - "pytest*"
          - "fakeredis*"
          - "ruff*"
    ignore:
      # fakeredis 2.36.0 refactored CLIENT INFO so in-process connections stop
      # exposing 'addr'; RQ's _set_ip_address reads client['addr'] without
      # catching KeyError, breaking the SimpleWorker burst tests. Hold until
      # upstream restores the field (or RQ guards the lookup), then drop this
      # entry and the <2.36.0 cap in pyproject.toml.
      - dependency-name: "fakeredis"
        versions:
          - ">=2.36.0"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
